[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ticket-classification"
version = "0.1.0"
description = "Cloud-native ticket and claim clustering and classification pipeline powered by llm-gateway-sdk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llm-gateway-sdk[settings] @ git+https://github.com/eslam-aboutaleb/llm-gateway-sdk.git@9e2c80a7c9052dadff389d689dd7a6a1a1803507",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "langdetect>=1.0.9",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
discovery = ["umap-learn>=0.5.6"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ticket-clf = "ticket_classification.controllers.cli:main"
ticket-api = "ticket_classification.controllers.server:main"
ticket-worker = "ticket_classification.controllers.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/ticket_classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/configs", "/scripts", "/docs", "/README.md", "/Dockerfile", "/compose.yaml", "/.dockerignore", "/.env.example", "/pyproject.toml", "/uv.lock"]
