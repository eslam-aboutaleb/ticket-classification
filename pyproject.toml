[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-classification"
version = "0.1.0"
description = "Cloud-native ticket and claim clustering and classification pipeline powered by llm-gateway-sdk"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "llm-gateway-sdk[settings] @ git+https://github.com/eslam-aboutaleb/llm-gateway-sdk.git@9e2c80a7c9052dadff389d689dd7a6a1a1803507",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ticket-clf = "ticket_classification.controllers.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
