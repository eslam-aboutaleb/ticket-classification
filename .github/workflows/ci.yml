# Centralized CI Quality Pipeline
# Calls shared reusable workflows in eslam-aboutaleb/ci-workflows

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/ci.yml@225793bab5a8d87363ffefda5e224b553c714bec
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    secrets:
      AI_EVAL_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
